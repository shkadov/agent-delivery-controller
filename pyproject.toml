[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-delivery-controller"
version = "0.1.0"
description = "Machine-checkable delivery controls for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
adc = "adc.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "types-pyyaml>=6.0.12.20240917",
]

[tool.hatch.build.targets.wheel]
packages = ["adc"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["adc", "tests"]

